name: hotspot
description: Find and book co-working spaces near you.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^10.0.0
  cached_network_image: ^3.3.0
  intl: ^0.18.0
  url_launcher: ^6.2.0
  http: ^1.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  crypto: ^3.0.3
  image_picker: ^1.0.7
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  google_fonts: ^6.1.0
  phosphor_flutter: ^2.1.0
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#111111"
  android: true
  ios: false
  android_12:
    color: "#111111"

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/icon/